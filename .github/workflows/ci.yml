name: Verificação do APMail
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apmail
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: apmail_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U apmail -d apmail_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://apmail:testpassword@localhost:5432/apmail_test
      DATABASE_URL_TEST: postgres://apmail:testpassword@localhost:5432/apmail_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_URL_TEST: redis://localhost:6379/1
      APP_URL: http://localhost:5173
      SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
