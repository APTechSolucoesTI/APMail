name: Verificação do APMail
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apmail
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: apmail_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U apmail -d apmail_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      greenmail:
        image: greenmail/standalone:2.1.0
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=comercial:Senha123@apmail.local,suporte:Senha123@apmail.local,cliente:Senha123@cliente.local -Dgreenmail.users.login=email
        ports: ['3025:3025', '3143:3143']
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://apmail:testpassword@localhost:5432/apmail_test
      DATABASE_URL_TEST: postgres://apmail:testpassword@localhost:5432/apmail_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_URL_TEST: redis://localhost:6379/1
      APP_URL: http://localhost:5173
      SESSION_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      POSTGRES_USER: apmail
      POSTGRES_DB: apmail_ci
      POSTGRES_PASSWORD: ci-compose-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: bash -n scripts/backup-production.sh
      - name: Build e saúde da stack de produção
        env:
          APP_URL: http://localhost:8080
        run: |
          docker compose config --quiet
          docker compose config --format json | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const c=JSON.parse(s);if(Object.values(c.services).some(x=>x.ports?.length))process.exit(1)})'
          docker compose build
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml up -d --wait --wait-timeout 180
          curl -fsS http://localhost:8080/api/health
          for service in postgres redis api worker web; do
            test "$(docker compose exec -T "$service" id -u)" != 0
          done
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")" = 0
      - name: Encerrar stack de produção
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.example.yml down --remove-orphans
