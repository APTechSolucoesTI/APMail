name: apmail
x-server-env: &server-env
  NODE_ENV: production
  TZ: ${TZ:-America/Sao_Paulo}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: ${APP_URL:?Configure APP_URL}
  DATABASE_URL: postgres://${POSTGRES_USER:-apmail}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apmail}
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET}
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Configure CREDENTIALS_ENCRYPTION_KEY}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
  STORAGE_DIR: /data/storage
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  SYSTEM_SMTP_HOST: ${SYSTEM_SMTP_HOST:-}
  SYSTEM_SMTP_PORT: ${SYSTEM_SMTP_PORT:-587}
  SYSTEM_SMTP_SECURE: ${SYSTEM_SMTP_SECURE:-false}
  SYSTEM_SMTP_USER: ${SYSTEM_SMTP_USER:-}
  SYSTEM_SMTP_PASSWORD: ${SYSTEM_SMTP_PASSWORD:-}
  SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-}
  WORKER_SYNC_EVERY_SECONDS: ${WORKER_SYNC_EVERY_SECONDS:-60}
  WORKER_RECONCILE_EVERY_MINUTES: ${WORKER_RECONCILE_EVERY_MINUTES:-10}
  WORKER_SYNC_CONCURRENCY: ${WORKER_SYNC_CONCURRENCY:-5}
  WORKER_SEND_CONCURRENCY: ${WORKER_SEND_CONCURRENCY:-5}
  WORKER_ACTIONS_CONCURRENCY: ${WORKER_ACTIONS_CONCURRENCY:-5}
  STORAGE_SCAN_BATCH: ${STORAGE_SCAN_BATCH:-5000}
  STORAGE_SCAN_BUDGET_MS: ${STORAGE_SCAN_BUDGET_MS:-20000}
  STORAGE_PUBLISH_SECONDS: ${STORAGE_PUBLISH_SECONDS:-60}
  STORAGE_HISTORY_HOURLY_DAYS: ${STORAGE_HISTORY_HOURLY_DAYS:-90}
  STORAGE_HISTORY_DAILY_MONTHS: ${STORAGE_HISTORY_DAILY_MONTHS:-24}
  DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT:-80}
  DISK_CRITICAL_PERCENT: ${DISK_CRITICAL_PERCENT:-90}
  SYNC_DELAY_MINUTES: ${SYNC_DELAY_MINUTES:-10}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-90}
  INFRA_METRICS_FILE: /data/metrics/infra.json
  ALLOW_INSECURE_TLS_HOSTS: ${ALLOW_INSECURE_TLS_HOSTS:-}
services:
  postgres:
    image: postgres:17-alpine
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apmail}
      POSTGRES_USER: ${POSTGRES_USER:-apmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes: [pgdata:/var/lib/postgresql/data]
    expose: ['5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    user: redis
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    expose: ['6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    image: ${APMAIL_API_IMAGE:-apmail-api:local}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: [node, dist/migrate.js]
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  api:
    image: ${APMAIL_API_IMAGE:-apmail-api:local}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      <<: *server-env
      API_PORT: 3001
    volumes: [storage:/data/storage]
    expose: ['3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    image: ${APMAIL_WORKER_IMAGE:-apmail-worker:local}
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment: *server-env
    volumes:
      - storage:/data/storage
      - ${APMAIL_METRICS_DIRECTORY:-./.data/metrics}:/data/metrics:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const fs=require('fs');try{if(Date.now()-fs.statSync('/tmp/heartbeat').mtimeMs>90000)process.exit(1)}catch{process.exit(1)}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    image: ${APMAIL_WEB_IMAGE:-apmail-web:local}
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    expose: ['80']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  redisdata:
  storage:
